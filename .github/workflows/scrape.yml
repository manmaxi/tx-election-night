name: Update results

# How this stays reliable: GitHub's scheduler often skips or delays runs on small repositories,
# so each run keeps checking on its own for about 5.5 hours (every 30 minutes now, every
# 2 minutes on election night), then starts its own replacement. The schedules below only
# restart that chain if it ever breaks. The chain stops on its own after Nov. 7, 2026.
on:
  schedule:
    - cron: "17 */3 * * *"
    # Extra restart points around election night (00:30 and 01:30 UTC Nov 4 = 7:30 and 8:30 p.m. CT Nov 3).
    - cron: "30 0,1 4 11 *"
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Keep checking for this many minutes (0 = one pass, no chaining)."
        default: "330"

permissions:
  contents: write
  actions: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moved to 26.04 on 10/19/26, which Playwright 1.56 does not support
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - name: Choose run length
        id: plan
        run: echo "loop=${{ github.event.inputs.loop_minutes || '330' }}" >> $GITHUB_OUTPUT
      - name: Scrape
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          PUSH='git add site/data site/*.png && (git diff --cached --quiet || (git commit -m "Update results $(date -u +%H:%M)" && git pull --rebase && git push))'
          node scraper/run.mjs --og --loop=${{ steps.plan.outputs.loop }} --every=auto --onpass="$PUSH"
          eval "$PUSH"
      - name: Start the next run
        if: ${{ !cancelled() && steps.plan.outputs.loop != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d)" -le 20261107 ]; then
            gh workflow run scrape.yml --ref main -f loop_minutes=330 && echo "Next run queued."
          else
            echo "Election window over; not chaining."
          fi
